    <div class="container">
        <h1 class="titulo">Subtração de Números</h1>
        <p>Crie um programa que armazene dois números e apresente o resultado da subtração entre as variáveis no console.</p>
        <div class="exercicio-container">
            <div class="card">
                <div class="visor">
                    <p class="mensagem-final"></p>
                </div>
                <div class="campos">
                    <div class="campo">
                        <label for="#numero1">Digite o primeiro número:</label>
                        <input type="number" id="numero1" placeholder="Ex: 28">
                        <span class="mensagem-erro-primeiro"></span>
                    </div>
                    <div class="campo">
                        <label for="#numero2">Digite o segundo número:</label>
                        <input type="number" name="numero2" id="numero2" placeholder="Ex: 16">
                        <span class="mensagem-erro-segundo"></span>
                    </div>
                </div>
                <button id="enviar">Enviar Informações</button>
            </div>
        </div>
